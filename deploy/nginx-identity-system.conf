# nginx site config for the identity-system container: serves the built
# frontend (frontend/dist/) for its own client-side routes, and
# reverse-proxies everything else to the FastAPI app on 127.0.0.1:8000
# (see identity-system-api.service).
#
# Deliberately proxy-by-default (the `location /` fallback at the bottom)
# rather than static-by-default: this backend still has a long list of
# bare paths (/verify, /logout, /me, /profile, /password, /2fa/*, plus the
# newer /api/*) that other apps' own nginx configs and their deployed
# frontends hardcode (see CLAUDE.md) - proxying by default means a future
# new backend route just works without this file needing to know about it.
# Only the frontend's own known client-side page routes are called out
# explicitly to serve the SPA shell instead.
#
# server_name is a placeholder - replace with your real domain. Put this
# behind TLS (certbot's --nginx plugin or your own CA) before treating it
# as more than a starting point: the session cookie is Secure by default
# (IDENTITY_SYSTEM_COOKIE_SECURE), and every downstream app's forward-auth
# hook assumes this is reachable over HTTPS.
#
# remote-setup.sh installs/refreshes this file on every deploy - edit it
# here, not on the container, or the next deploy will silently overwrite a
# hand-edit (e.g. one certbot made in place) away.
server {
    listen 80;
    listen [::]:80;
    server_name identity.atathome.me;

    root __BACKEND_DIR__/frontend/dist;

    location = / { try_files /index.html =404; }
    location = /login { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /account { try_files /index.html =404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
