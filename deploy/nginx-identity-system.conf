# nginx site config for the identity-system container: terminates
# sso.example.com and reverse-proxies everything to the FastAPI app on
# 127.0.0.1:8000 (see identity-system-api.service). There's no static
# frontend to serve here - the login page (templates.py) is rendered
# server-side by the app itself.
#
# server_name is a placeholder - replace with your real domain. Put this
# behind TLS (certbot's --nginx plugin or your own CA) before treating it
# as more than a starting point: the session cookie is Secure by default
# (IDENTITY_SYSTEM_COOKIE_SECURE), and every downstream app's forward-auth
# hook assumes this is reachable over HTTPS.
#
# remote-setup.sh installs/refreshes this file on every deploy - edit it
# here, not on the container, or the next deploy will silently overwrite a
# hand-edit (e.g. one certbot made in place) away.
server {
    listen 80;
    listen [::]:80;
    server_name sso.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
